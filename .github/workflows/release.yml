name: Release OSM

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build binary with PyInstaller
        run: |
          pyinstaller --onefile osm.py
        env:
          PYTHONPATH: .

      - name: Archive binary
        uses: actions/upload-artifact@v2
        with:
          name: osm-binary
          path: dist/osm

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
          files: dist/osm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version
        id: extract_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/orbit-simple-monitor:latest .
          docker tag ${{ secrets.DOCKER_USERNAME }}/orbit-simple-monitor:latest ${{ secrets.DOCKER_USERNAME }}/orbit-simple-monitor:${{ env.VERSION }}
          docker push ${{ secrets.DOCKER_USERNAME }}/orbit-simple-monitor:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/orbit-simple-monitor:${{ env.VERSION }}